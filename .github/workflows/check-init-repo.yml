name: Check Repository Initialization

# Applies the changes that init-repo.yml makes in new repositories to a copy of
# the template, and runs R CMD check on the result. This catches template
# changes that would make R CMD check fail in new repositories, such as an
# import that is only used by a file the initialization deletes.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check-initialized:
    # Only in the template itself. init-repo.yml deletes this file in new repositories.
    if: github.event.repository.name == 'rapRegTemplate'
    runs-on: ubuntu-24.04
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ github.token }}
      R_COMPILE_AND_INSTALL_PACKAGES: never
    steps:
      - uses: actions/checkout@v7

      - name: Initialize As A New Repository
        # Changes only this job's checkout; nothing is committed or pushed
        run: bash .github/scripts/init-repo.sh initCheck "Ola Nordmann" "ola.nordmann@example.com"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Same failure threshold as testing.yaml
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"note"'
          args: c("--no-manual")
