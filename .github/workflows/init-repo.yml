name: Initialize New Repository

# Runs on push, but the job below only does anything on the default branch
# of a repository created from the template, and only until it is initialized
on: [push]

# Never run two initializations at the same time
concurrency:
  group: init-repo

jobs:
  setup-template-variables:
    # Ensure this runs on the newly created repository, not the template itself,
    # and only for pushes to the default branch
    if: >-
      github.event.repository.name != 'rapRegTemplate' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Fixed branch name, so an initialization already under way can be detected
      INIT_BRANCH: chore/init-repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Check For Existing Initialization Branch
        id: guard
        run: |
          # Skip the rest if the branch exists, i.e. a PR is already waiting
          if git ls-remote --exit-code --heads origin "$INIT_BRANCH" > /dev/null; then
            echo "Branch $INIT_BRANCH already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace Placeholder Variables
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Define some variables from GitHub context
          REPO_NAME="${{ github.event.repository.name }}"
          name=`git log --reverse --pretty=format:"%an" | head -n 1`
          email=`git log --reverse --pretty=format:"%ae" | head -n 1`
          last="${name##* }"
          first="${name% *}"
          
          # Use sed to search and replace template placeholders with GitHub metadata
          find . -type f -not -path '*/.git/*' -exec sed -i "s/rapRegTemplate/$REPO_NAME/g" {} +
          # Rename the R project file to match the new repository name
          mv rapRegTemplate.Rproj ${REPO_NAME}.Rproj

          # Update DESCRIPTION file with repository-specific information
          sed -i "s/Version.*/Version: 0.1.0/g" DESCRIPTION
          sed -i "s/Title:.*/Title: Rapporteket application for $REPO_NAME/g" DESCRIPTION
          sed -i "/Author/,/Maintainer/c\
          Authors@R: c(\n\
              person(given = \"${first}\",\n\
                     family = \"${last}\",\n\
                     role = c(\"aut\", \"cre\"),\n\
                     email = \"${email}\"))\n\
          Maintainer: ${name} <${email}>" DESCRIPTION

          # Delete stuff from README.md
          sed -i '/<!-- badges: end -->/q' README.md
          echo "" >> README.md
          echo "# Rapportek for ${REPO_NAME}" >> README.md
          echo "" >> README.md

          # Remove unnecessary files and directories
          rm -rf docker-compose.yml
          rm -rf dev/db
          rm -rf dev/mssql
          rm .github/workflows/docker.yml

      - name: Clean Up This Workflow File
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Delete this workflow file so it doesn't run again
          rm .github/workflows/init-repo.yml

      - name: Create Branch and Open Pull Request
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH_NAME="$INIT_BRANCH"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "Initialize repository with template variables"
          git push --set-upstream origin "$BRANCH_NAME"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "Initialize repository from template" \
            --body "This PR applies the repository-specific values and removes template-only setup files."
